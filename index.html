<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roblox Limiteds Market</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Roblox Limiteds Market</h1>
  <div class="grid">
    <div class="item">
      <img src="images/CF.webp" alt="The Classic Roblox Fedora" />
      <p>The Classic Roblox Fedora</p>
      <div class="price">$500</div>
      <button class="buy-btn" onclick="buyItem('The Classic Roblox Fedora')">Buy</button>
    </div>
    <div class="item">
      <img src="images/Country Morning.webp" alt="Country Morning" />
      <p>Country Morning</p>
      <div class="price">$120</div>
      <button class="buy-btn" onclick="buyItem('Country Morning')">Buy</button>
    </div>
    <div class="item">
      <img src="images/FF.webp" alt="Fuchsia Fantastique" />
      <p>Fuchsia Fantastique</p>
      <div class="price">$250</div>
      <button class="buy-btn" onclick="buyItem('Fuchsia Fantastique')">Buy</button>
    </div>
    <div class="item">
      <img src="images/Valk.webp" alt="Valkyrie Helm" />
      <p>Valkyrie Helm</p>
      <div class="price">$400</div>
      <button class="buy-btn" onclick="buyItem('Valkyrie Helm')">Buy</button>
    </div>
  </div>

  <script>
    function buyItem(itemName) {
      let confirmPurchase = confirm(`Do you want to buy "${itemName}"?`);
      if (confirmPurchase) {
        alert(`You bought ${itemName}!`);
      } else {
        alert(`Purchase canceled for ${itemName}.`);
      }
    }
  </script>
</body>
</html>
